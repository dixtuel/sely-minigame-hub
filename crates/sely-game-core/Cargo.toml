[package]
name = "sely-game-core"
version = "2.0.0"
edition = "2021"
authors = ["Asrın Kılıç <asrinklcc@sely.tr>"]
license = "AGPL-3.0"
description = "High-performance WebAssembly game logic engine for SELY MiniGame Hub"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
sha2 = "0.11"
rand = "0.10"
getrandom = { version = "0.4", features = ["wasm_js"] }
