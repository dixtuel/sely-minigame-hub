services:
  sely-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    container_name: sely-minigame-hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-file:/app/data/sely.db}
      - REDIS_URL=${REDIS_URL:-}
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - sely-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: sely-minigame-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  sely-data:
    driver: local
  redis-data:
    driver: local
