services:
  sely-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sely-minigame-hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TURSO_DATABASE_URL=file:/app/data/sely.db
      - REDIS_URL=redis://redis:6379
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-localhost}
    env_file:
      - path: ../.env
        required: false
    volumes:
      - sely-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sely-minigame-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  sely-data:
    driver: local
  redis-data:
    driver: local
