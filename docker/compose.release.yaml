services:
  app:
    image: ghcr.io/dixtuel/sely-minigame-hub:__RELEASE_TAG__
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sely-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sely-data:
