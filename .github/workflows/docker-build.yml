name: Docker Build Validation

on:
  push:
    branches: [ "main" ]
    paths:
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vite.config.ts'
      - 'assets/fonts/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vite.config.ts'
      - 'assets/fonts/**'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build self-hosted Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=sely-docker
          # Keep cache writes on trusted main pushes. PRs can reuse the default
          # branch cache but cannot alter it; cache export failures never fail a build.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=sely-docker,ignore-error=true' || '' }}
