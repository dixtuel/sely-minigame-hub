name: Prepare Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example, v2.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    name: Package selected tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag input
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v2.1.0." >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo registry and build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend
          workspaces: |
            .
            crates/sely-game-core
          save-if: 'false'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release packages
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: scripts/package-release.sh --lang en --platform linux/amd64 "$RELEASE_TAG"

      - name: Verify release checksums
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd "dist/releases/$RELEASE_TAG"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          test -s "sely-$RELEASE_TAG-amd64-docker.tar.gz"
          test -s "sely-$RELEASE_TAG-amd64-standalone.tar.gz"
          sha256sum --check SHA256SUMS

      - name: Smoke test packaged Docker service
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d)"
          export COMPOSE_PROJECT_NAME="sely-release-test-${GITHUB_RUN_ID}"
          cleanup() {
            docker compose -f "$bundle_dir/compose.yaml" --project-directory "$bundle_dir" down --volumes >/dev/null 2>&1 || true
            rm -r -- "$bundle_dir"
          }
          trap cleanup EXIT
          tar -xzf "dist/releases/$RELEASE_TAG/sely-$RELEASE_TAG-amd64-docker.tar.gz" -C "$bundle_dir"
          (cd "$bundle_dir" && PORT=31777 ./start.sh)
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:31777/api/config >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$bundle_dir/compose.yaml" --project-directory "$bundle_dir" logs app
          exit 1

      - name: Smoke test packaged standalone service
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
            cd "$GITHUB_WORKSPACE"
            rm -r -- "$bundle_dir"
          }
          trap cleanup EXIT
          tar -xzf "dist/releases/$RELEASE_TAG/sely-$RELEASE_TAG-amd64-standalone.tar.gz" -C "$bundle_dir"
          "$bundle_dir/install.sh" --lang en --prefix "$bundle_dir/installed"
          cd "$bundle_dir/installed"
          PORT=31778 ./standalone &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:31778/api/config >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Upload packaged release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.validate.outputs.tag }}
          path: dist/releases/${{ steps.validate.outputs.tag }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  create-draft:
    if: github.ref == 'refs/heads/main'
    name: Attach files to a draft GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged release files
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.package.outputs.tag }}
          path: release-assets

      - name: Verify checksums and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          test -s "sely-$RELEASE_TAG-amd64-docker.tar.gz"
          test -s "sely-$RELEASE_TAG-amd64-standalone.tar.gz"
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "SELY MiniGame Hub $RELEASE_TAG"
