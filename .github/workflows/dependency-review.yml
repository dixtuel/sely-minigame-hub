name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'crates/**/Cargo.lock'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review introduced runtime vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false
